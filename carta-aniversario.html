<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti, Dhiana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Dancing+Script:wght@500;700&display=swap">
<style>
:root{--bg1:#ffe4ec;--bg2:#ffbdd0;--ink:#4a1030;--soft:#8a3a5e;--paper:#fffaf2;--line:#f3dccf;--accent:#d62459;--env:#f0b9a4;--env2:#e6a58e;--env3:#f7cdbd;--shadow:rgba(214,36,89,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#240818;--bg2:#431129;--ink:#ffe9f0;--soft:#ffb3cc;--paper:#3a1027;--line:#4c1a36;--accent:#ff5c8a;--env:#a8566f;--env2:#8f4560;--env3:#bd6c86;--shadow:rgba(255,92,138,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#240818;--bg2:#431129;--ink:#ffe9f0;--soft:#ffb3cc;--paper:#3a1027;--line:#4c1a36;--accent:#ff5c8a;--env:#a8566f;--env2:#8f4560;--env3:#bd6c86;--shadow:rgba(255,92,138,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:.85rem 1.7rem;font-size:1.05rem;box-shadow:0 6px 18px var(--shadow)}
button:active{transform:scale(.97)}
.script{font-family:"Dancing Script",cursive,Georgia,serif}
#env{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1.5rem;text-align:center;background:linear-gradient(160deg,var(--bg1),var(--bg2));transition:opacity .8s}
#env.fade{opacity:0}
#env h1{font-size:2rem;margin:0}
.to{color:var(--soft);margin:0}
.stage{perspective:900px}
.envelope{position:relative;width:min(82vw,320px);height:210px;background:var(--env);border-radius:8px;box-shadow:0 14px 30px var(--shadow);cursor:pointer;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.front{position:absolute;inset:0;background:var(--env3);clip-path:polygon(0 100%,0 30%,50% 64%,100% 30%,100% 100%);border-radius:8px}
.flap{position:absolute;left:0;top:0;width:100%;height:64%;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s;z-index:3}
.seal{position:absolute;left:50%;top:calc(64% - 24px);width:48px;height:48px;margin-left:-24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.4rem;z-index:4;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .4s}
.envelope.open{animation:none}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
.hint{color:var(--soft);font-size:.9rem;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
main{max-width:560px;margin:0 auto;padding:1.6rem 1rem 1rem}
#paper{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);border-radius:10px;padding:1.6rem 1.3rem;box-shadow:0 12px 30px var(--shadow);line-height:32px;font-size:1.12rem;animation:rise 1s both}
#paper p{margin:0 0 32px;opacity:0;transform:translateY(8px);animation:rise .9s forwards}
#paper .date{text-align:right;color:var(--soft);font-size:.95rem}
#paper .big{font-size:1.9rem;color:var(--accent);line-height:40px}
#paper b{color:var(--accent)}
.sign{font-size:1.9rem;color:var(--accent);text-align:right;line-height:40px!important}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tail{text-align:center;padding:1.8rem 0;opacity:0;animation:rise 1s forwards}
.tail h2{font-size:1.7rem;margin:0 0 .3rem}
.sub{color:var(--soft);margin:0 0 1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.6rem}
.card{background:var(--paper);border-radius:6px;min-height:130px;padding:.9rem .7rem;box-shadow:0 4px 12px var(--shadow);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;border:2px solid transparent;transform:rotate(var(--r,0deg));transition:transform .25s}
.card:active{transform:rotate(0) scale(.97)}
.card .e{font-size:2rem}
.card .t{font-weight:bold;color:var(--accent)}
.card .tap{font-size:.75rem;color:var(--soft)}
.card .back{display:none;font-size:.95rem;line-height:1.35}
.card.open{border-color:var(--accent);transform:rotate(0)}
.card.open .back{display:block}
.card.open .e,.card.open .tap{display:none}
footer{text-align:center;padding:1.5rem 1rem 3rem}
.dev{font-family:"Metal Mania",Impact,fantasy;text-transform:uppercase;font-size:1.2rem;letter-spacing:.06em}
#secret{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
#secret .heart-big{font-size:5.5rem;animation:beat 1.1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
#secret p{font-size:1.8rem;margin:0;line-height:1.3}
.heart{position:fixed;top:-2rem;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg);opacity:.3}}
</style>
</head>
<body>

<div id="env">
  <p class="to">Una carta para</p>
  <h1 class="script">Ruth Dhiana Ruiz Ugarte</h1>
  <div class="stage"><div class="envelope" id="envelope"><div class="front"></div><div class="flap"></div><div class="seal">💗</div></div></div>
  <p class="hint">Toca el sobre para abrirlo</p>
</div>

<main id="main" class="hidden">
  <div id="paper"></div>
  <div class="tail" id="tail">
    <h2 class="script">P.D.: en el sobre quedaron unos papelitos</h2>
    <p class="sub">Toca cada uno para desdoblarlo</p>
    <div class="grid" id="cards"></div>
    <button id="secretBtn">Un último secreto 🤫</button>
  </div>
</main>

<footer class="hidden" id="foot"><div class="dev">d4rkkr15t . Murcia🦇</div></footer>

<div id="secret" class="hidden">
  <div class="heart-big">💖</div>
  <p class="script">Te amo mucho, mi amor.<br>Mucho, mucho.</p>
  <p class="sub" style="font-size:1rem">9 de noviembre de 2025 – 9 de noviembre de 2026</p>
  <button id="back">Volver a mi carta</button>
</div>

<script>
var START=new Date(2025,10,9,0,0,0);
var paper=document.getElementById("paper");
var lines=[
 ['date','9 de noviembre de 2026'],
 ['big script','Mi Ruth Dhiana:'],
 ['','Hoy hace un año nos conocimos. Hoy hace un año nos hablamos por primera vez, y nuestro primer mensaje fue: <b>“¿Te mordiste?”</b>'],
 ['','Desde ese día han pasado <b id="d">365</b> días, <b id="h">0</b> horas, <b id="m">0</b> minutos y <b id="s">0</b> segundos, y los he vivido pensando en ti.'],
 ['','Muchos creerán: ¿qué es eso? Es algo cómico, ¿qué sucedió? Pero ese simple mensaje luego cobró un nuevo significado: mi vida a tu lado.'],
 ['','Esa pequeña pregunta ha hecho que, después de un año, mi vida haya cambiado totalmente. Y tus ojitos son mi única guía hacia un futuro maravilloso a tu lado.'],
 ['','Gracias por darme tantas sonrisas, buenos momentos, alegrías y hasta enojos. Mi compradora compulsiva, mi chismosita hermosa.'],
 ['','Te amo mucho, mi amor. Mucho, mucho. 💕'],
 ['sign script','Cristian Fabián Murcia Moreno']
];
lines.forEach(function(l,i){
  var p=document.createElement("p");
  p.className=l[0];p.innerHTML=l[1];
  p.style.animationDelay=(0.5+i*1.1)+"s";
  paper.appendChild(p);
});
var tail=document.getElementById("tail");
tail.style.animationDelay=(0.5+lines.length*1.1+0.6)+"s";

function tick(){
  var s=Math.floor(Math.max(0,Date.now()-START.getTime())/1000);
  var d=document.getElementById("d");if(!d)return;
  d.textContent=Math.floor(s/86400);
  document.getElementById("h").textContent=Math.floor(s%86400/3600);
  document.getElementById("m").textContent=Math.floor(s%3600/60);
  document.getElementById("s").textContent=s%60;
}
tick();setInterval(tick,1000);

var items=[
 ["🩺","Futura doctora","Estás estudiando medicina, y eso dice mucho de lo valiente y dedicada que eres."],
 ["🌀","Tus crespos","Tus crespos son hermosos, son tan tuyos y tan lindos."],
 ["😊","Tu sonrisa","Tu sonrisa es preciosa, y tengo la suerte de que me la regales."],
 ["👀","Tus ojitos","Tus ojos lindos son mi guía hacia un futuro maravilloso."],
 ["🥚","Tu carita","Tu carita redondita es tan linda, tan tierna."],
 ["🎉","Tu forma de ser","Eres súper divertida y súper agradable. Contigo todo es alegría."],
 ["🤫","Chismosita","Te encanta chismear, y la verdad, me encanta que seas así."],
 ["🛍️","Compradora oficial","Compradora compulsiva y con mucho estilo. Así te quiero."]
];
var grid=document.getElementById("cards");
items.forEach(function(it,i){
  var c=document.createElement("div");c.className="card";
  c.style.setProperty("--r",((i%2?1:-1)*(1+i%3))+"deg");
  c.innerHTML='<div class="e">'+it[0]+'</div><div class="t">'+it[1]+'</div><div class="tap">toca</div><div class="back">'+it[2]+'</div>';
  c.onclick=function(){c.classList.toggle("open")};
  grid.appendChild(c);
});

function hearts(n){
  for(var i=0;i<n;i++){
    (function(i){setTimeout(function(){
      var h=document.createElement("div");h.className="heart";
      h.textContent=["❤️","💕","💖","💗"][Math.floor(Math.random()*4)];
      h.style.left=Math.random()*95+"vw";
      h.style.fontSize=(14+Math.random()*20)+"px";
      h.style.animationDuration=(4+Math.random()*4)+"s";
      document.body.appendChild(h);
      setTimeout(function(){h.remove()},8500);
    },i*220)})(i);
  }
}
var envEl=document.getElementById("envelope"),started=false;
envEl.onclick=function(){
  if(started)return;started=true;
  envEl.classList.add("open");
  setTimeout(function(){
    var e=document.getElementById("env");e.classList.add("fade");
    document.getElementById("main").classList.remove("hidden");
    document.getElementById("foot").classList.remove("hidden");
    hearts(25);
    setTimeout(function(){e.classList.add("hidden")},800);
  },1100);
};
document.getElementById("secretBtn").onclick=function(){
  document.getElementById("secret").classList.remove("hidden");hearts(45);
};
document.getElementById("back").onclick=function(){
  document.getElementById("secret").classList.add("hidden");
};
</script>
</body>
</html>
